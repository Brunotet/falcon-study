name: Study videos

on:
  workflow_dispatch:
    inputs:
      remote_path:
        description: "Folder inside the MEGA folder, e.g. quick tips/quick tips S1"
        required: true
      label:
        description: Output folder name, e.g. S1
        required: true
      part:
        description: "Which slice of the folder, e.g. 1/2 or 2/2"
        default: "1/1"
      list_only:
        description: "true = only list the folder tree, download nothing"
        default: "false"
      whisper_model:
        description: tiny, base or small
        default: small
      callback_url:
        description: Optional n8n URL to receive a JSON summary
        required: false

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MEGA_URL: ${{ secrets.MEGA_URL }}
      PART: ${{ inputs.part }}
      REMOTE: ${{ inputs.remote_path }}
      LABEL: ${{ inputs.label }}
      MODEL: ${{ inputs.whisper_model }}
      CALLBACK: ${{ inputs.callback_url }}
      LIST_ONLY: ${{ inputs.list_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install faster-whisper
          wget -q https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb
          sudo apt-get install -y ./megacmd-xUbuntu_24.04_amd64.deb
      - name: Open MEGA folder and list
        run: |
          mkdir -p status
          mega-login "$MEGA_URL" > /dev/null 2>&1 || true
          mega-ls -lR > status/tree-$LABEL.txt 2>&1 || true
          wc -l status/tree-$LABEL.txt
      - name: Download from MEGA
        if: env.LIST_ONLY != 'true'
        run: |
          mkdir raw
          mega-get "$REMOTE" raw/ || mega-get "/fx falcon/$REMOTE" raw/ || mega-get "/falcon/$REMOTE" raw/
          du -sh raw
          find raw -type f | head -20
      - name: Transcribe, screenshot, pair
        if: env.LIST_ONLY != 'true'
        run: python study/process.py raw "out/$LABEL" "$MODEL"
      - name: Commit results
        if: always()
        run: |
          mkdir -p out status
          git config user.name "falcon-bot"
          git config user.email "falcon-bot@users.noreply.github.com"
          git add out status
          git diff --cached --quiet || git commit -m "study: $LABEL"
          git pull --rebase origin main || true
          git push
      - name: Callback
        if: always() && env.CALLBACK != '' && env.LIST_ONLY != 'true'
        run: |
          curl -sS -X POST -H "Content-Type: application/json" --data @status/$LABEL.json "$CALLBACK" || true

name: Trade charts

on:
  workflow_dispatch:
    inputs:
      symbols:
        default: GBPUSD,EURUSD,USDJPY,GBPJPY,AUDUSD,NZDCAD,GBPCAD,USDCAD

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SYMBOLS: ${{ inputs.symbols }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy matplotlib
      - name: Record trades and draw charts
        run: |
          rm -rf results/charts
          python engine/falcon_charts.py "$SYMBOLS" results/charts
      - name: Commit results
        if: always()
        run: |
          git config user.name "falcon-bot"
          git config user.email "falcon-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "trade charts"
          git pull --rebase origin main || true
          git push

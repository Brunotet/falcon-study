name: Backtest flags

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma separated forex pairs, e.g. GBPUSD,EURUSD,USDJPY
        default: GBPUSD,EURUSD,USDJPY,GBPJPY,AUDUSD,NZDCAD,GBPCAD,USDCAD
      label:
        description: Output name
        default: flags-v1

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SYMBOLS: ${{ inputs.symbols }}
      LABEL: ${{ inputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - name: Backtest
        run: |
          mkdir -p results
          python engine/falcon_engine.py "$SYMBOLS" | tee "results/$LABEL.json"
      - name: Commit results
        if: always()
        run: |
          git config user.name "falcon-bot"
          git config user.email "falcon-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "backtest: $LABEL"
          git pull --rebase origin main || true
          git push
